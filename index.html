<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EventCulture AI - interactive demo</title>
<meta name="description" content="Interactive demo of the EventCulture AI platform. All content is dummy data.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>:root{--ink:#000;--paper:#fff;--mist:#f7f7f7;--chalk:#e6e6e6;--pink:#d6336c;--pinkd:#b82a5b;--lilac:#ffb6ef;--yellow:#ffd12e;--maroon:#4e080c;--muted:#6e6262;--ok:#1f7a45;--warn:#b7791f;--rose:#d6336c;--r:16px;--sh:0 12px 34px rgba(0,0,0,.12)}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 "Nunito Sans",ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Bricolage Grotesque","Nunito Sans",ui-sans-serif,sans-serif;font-weight:500;line-height:1.08;margin:0 0 .5em;letter-spacing:-.02em}
h1{font-size:clamp(2.3rem,5.4vw,4rem)}h2{font-size:clamp(1.7rem,3.4vw,2.5rem)}h3{font-size:1.2rem}
a{color:inherit}p{margin:0 0 1em}.acc{color:var(--pink)}
.mono{font:italic 600 .9rem "Nunito Sans",sans-serif;color:var(--maroon);margin-bottom:6px}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px}.sec{padding:76px 0}.sec.alt{background:var(--mist)}.sec.dark{background:#000;color:#fff}
.center{text-align:center}.muted{color:var(--muted)}.small{font-size:.86rem}.sp{height:14px}
.grid{display:grid;gap:18px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}

@media(max-width:600px){.g3,.g4{grid-template-columns:1fr}.sec{padding:48px 0}}
/* demo bar */
#demobar{position:sticky;top:0;z-index:60;background:#111;color:#fff;font-size:.8rem}
#demobar .in{max-width:1160px;margin:0 auto;padding:7px 20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#demobar .tagd{background:var(--yellow);color:#000;font:800 .68rem "Nunito Sans";letter-spacing:.1em;padding:2px 8px;border-radius:99px}
#demobar .roles{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
#demobar button{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:99px;padding:3px 11px;font:inherit;cursor:pointer}
#demobar button.on{background:var(--pink);color:#fff;border-color:var(--pink)}#demobar button:hover{border-color:#fff}
/* header */
#hdr{position:sticky;top:34px;z-index:50;background:var(--mist);border-bottom:1px solid var(--chalk)}
#hdr .in{max-width:1160px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:18px}
.logo{font:600 1.15rem "Bricolage Grotesque",sans-serif;text-decoration:none;white-space:nowrap;letter-spacing:-.01em}
.nav{display:flex;gap:6px;flex-wrap:wrap;margin:0 auto}
.nav a{text-decoration:none;padding:6px 10px;font-size:.92rem;font-weight:600;color:#222;border-bottom:2px solid transparent}
.nav a:hover{color:var(--pink)}.nav a.on{border-bottom-color:#000}
.hr{display:flex;gap:8px;align-items:center}
@media(max-width:900px){#hdr .in{flex-wrap:wrap}.nav{order:3;width:100%;margin:0}}
@media(max-width:700px){#hdr{position:static}#toast{bottom:80px}}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;border:1.5px solid #000;background:#fff;color:#000;padding:10px 20px;border-radius:30px;font:700 .95rem "Nunito Sans",sans-serif;cursor:pointer;text-decoration:none;transition:transform .12s,background .12s}
.btn:hover{transform:translateY(-1px)}.btn.p{background:var(--pink);color:#fff;border-color:var(--pink)}.btn.p:hover{background:var(--pinkd);border-color:var(--pinkd)}
.btn.b{background:var(--yellow);border-color:var(--yellow)}.btn.sm{padding:6px 14px;font-size:.84rem}.btn.lg{padding:14px 28px;font-size:1.02rem}
.btn[disabled],.btn.dis{opacity:.4;pointer-events:none}
.link{background:none;border:0;padding:0;color:var(--pink);text-decoration:underline;cursor:pointer;font:inherit}
/* cards */
.card{background:var(--mist);border:0;border-radius:var(--r);padding:22px}
.card.flat{background:transparent}.card h3{margin-bottom:.3em}
.badge{display:inline-flex;align-items:center;gap:5px;font:700 .72rem "Nunito Sans";padding:3px 10px;border-radius:99px;background:#ececec;color:#000}
.badge.ok{background:#dff1e4;color:#1d5a37}.badge.warn{background:#fff0c2;color:#7a5410}.badge.draft{background:var(--yellow)}.badge.bad{background:#fbd9e4;color:#9d1f4a}
.chip{display:inline-block;padding:5px 13px;border:1.5px solid var(--chalk);border-radius:99px;font-size:.88rem;font-weight:600;background:#fff;cursor:pointer}.chip.on{background:#000;color:#fff;border-color:#000}
.step{display:flex;gap:12px}.step b{font:700 .8rem "Nunito Sans";color:var(--maroon)}

@media(max-width:900px){.hero .grid{grid-template-columns:1fr}}
.cmp{position:relative;border-radius:20px;overflow:hidden;background:#ddd;aspect-ratio:3/2;box-shadow:var(--sh)}
.cmp canvas{position:absolute;inset:0;width:100%;height:100%}.cmp .top{clip-path:inset(0 50% 0 0)}
.cmp input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;margin:0}
.cmp .hd{position:absolute;top:0;bottom:0;left:50%;width:3px;background:#fff;pointer-events:none}
.cmp .hd::after{content:"\2194";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:38px;height:38px;border-radius:50%;background:var(--pink);color:#fff;display:grid;place-items:center;font-size:.95rem;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.cmp .lab{position:absolute;bottom:10px;font:700 .72rem "Nunito Sans";background:rgba(0,0,0,.75);color:#fff;padding:3px 10px;border-radius:99px}.cmp .l1{left:10px}.cmp .l2{right:10px}
canvas.art{width:100%;height:auto;display:block;border-radius:14px;background:#ddd}
.tile{cursor:pointer;border:0;border-radius:18px;overflow:hidden;background:var(--mist);transition:transform .15s,box-shadow .15s}.tile:hover{transform:translateY(-3px);box-shadow:var(--sh)}.tile.sel{box-shadow:0 0 0 3px var(--pink)}
.tile .cap{padding:10px 14px;font-weight:700;font-size:.92rem;display:flex;justify-content:space-between;gap:6px}
/* forms */
label{display:block;font-weight:700;font-size:.88rem;margin:0 0 5px}
input,select,textarea{width:100%;font:inherit;padding:11px 13px;border:1.5px solid var(--chalk);border-radius:12px;background:#fff;color:#000}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pink);box-shadow:0 0 0 3px rgba(214,51,108,.15)}textarea{min-height:90px;resize:vertical}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--pink)}input[type=range]{padding:0}
.fld{margin-bottom:14px}.err{color:var(--pink);font-size:.84rem;margin-top:4px;font-weight:600}.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1;min-width:160px}
/* stepper */
.stepper{display:flex;gap:6px;margin:0 0 26px;flex-wrap:wrap}.stepper div{flex:1;min-width:110px;padding:10px 14px;border-radius:12px;background:var(--mist);font-size:.85rem;font-weight:700;color:var(--muted)}
.stepper div.on{background:#000;color:#fff}.stepper div.done{background:var(--lilac);color:#000}

table.t td{padding:11px 12px;border-bottom:1px solid var(--chalk);vertical-align:middle}table.t tr:last-child td{border-bottom:0}
.tw{overflow-x:auto}
/* design card */
.dc{background:var(--mist);border:0;border-radius:20px;overflow:hidden}.dc .bd{padding:16px}.dc .ac{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.checklist{list-style:none;margin:0;padding:0}.checklist li{padding:5px 0;display:flex;gap:8px;align-items:flex-start;font-size:.92rem}
.tick{color:var(--ok);font-weight:800}.cross{color:var(--pink);font-weight:800}
/* vendors + paywall */
.vcard{background:var(--mist);border:0;border-radius:20px;overflow:hidden;display:flex;flex-direction:column}
.vcard .ph{height:92px;position:relative}.vcard .bd{padding:16px;flex:1;display:flex;flex-direction:column;gap:6px}.vcard .ft{display:flex;gap:6px;margin-top:auto;padding-top:8px;flex-wrap:wrap}
.lockwrap{position:relative}.locked{filter:grayscale(1) blur(2.2px);opacity:.55;pointer-events:none;user-select:none}
.lockcard{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(440px,92%);background:#fff;border:0;border-radius:22px;padding:26px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.28);z-index:5}
.lockcard .ic{width:48px;height:48px;border-radius:50%;background:var(--lilac);display:grid;place-items:center;margin:0 auto 10px;font-size:1.2rem}
.banner{background:var(--lilac);border-radius:18px;padding:16px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:22px}.banner .grow{flex:1;min-width:220px}
.keybox{font:800 1.3rem "Nunito Sans",monospace;letter-spacing:.1em;background:#000;color:var(--yellow);padding:16px 18px;border-radius:14px;text-align:center;margin:12px 0}
.plan{position:relative;background:var(--mist)}.plan.pop{background:#fff;border:2px solid var(--pink);box-shadow:var(--sh)}.plan .pr{font:600 2.4rem "Bricolage Grotesque",sans-serif}.plan ul{padding-left:18px;margin:10px 0;color:var(--muted);font-size:.92rem}
/* modal, toast */
.mback{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:6vh 14px;overflow:auto}
.mbox{position:relative;background:#fff;border-radius:24px;max-width:560px;width:100%;padding:28px;box-shadow:0 30px 80px rgba(0,0,0,.35)}.mbox.wide{max-width:900px}
.mx{position:absolute;top:10px;right:14px;background:none;border:0;font-size:1.6rem;cursor:pointer;color:var(--muted)}

#toast div{background:#000;color:#fff;padding:10px 18px;border-radius:99px;font-size:.9rem;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.25);animation:pop .25s}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* guide */
#guide{position:fixed;right:16px;bottom:16px;z-index:70;font-size:.85rem}
#guide .tg{background:var(--pink);color:#fff;border:0;border-radius:99px;padding:11px 18px;font:700 .88rem "Nunito Sans";cursor:pointer;box-shadow:0 8px 24px rgba(214,51,108,.4)}
#guide .pn{position:absolute;right:0;bottom:52px;width:290px;background:#fff;border-radius:20px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.28)}
#guide ol{margin:8px 0 0;padding:0;list-style:none}#guide li{padding:5px 0;display:flex;gap:8px;cursor:pointer}#guide li i{width:20px;height:20px;border:1.5px solid #000;border-radius:50%;display:inline-grid;place-items:center;font-size:.7rem;font-style:normal;flex:none;font-weight:700}
#guide li.done i{background:var(--ok);border-color:var(--ok);color:#fff}#guide li.done span{color:var(--muted);text-decoration:line-through}
/* progress */
.bar{height:10px;border-radius:99px;background:var(--chalk);overflow:hidden}.bar i{display:block;height:100%;background:var(--pink);width:0;transition:width .4s}
.gsteps{list-style:none;margin:16px 0 0;padding:0}.gsteps li{padding:5px 0;color:var(--muted)}.gsteps li.on{color:#000;font-weight:700}.gsteps li.done{color:var(--ok)}
/* footer */
footer{background:#000;color:#fff;padding:52px 0 28px}footer a{color:#fff;opacity:.75;text-decoration:none;display:block;padding:3px 0}footer a:hover{opacity:1;color:var(--lilac)}
footer .mono{color:var(--lilac)}
.sidenav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:22px}.sidenav a{padding:8px 16px;border-radius:99px;background:var(--mist);text-decoration:none;font-weight:700;font-size:.88rem}.sidenav a.on{background:#000;color:#fff}
.stat{background:var(--mist);border-radius:18px;padding:18px}.stat b{display:block;font:600 2.2rem "Bricolage Grotesque",sans-serif}.stat span{color:var(--muted);font-size:.86rem}
.chat{display:flex;flex-direction:column;gap:8px;max-height:220px;overflow:auto;padding:12px;background:var(--mist);border-radius:14px;margin:10px 0}.msg{max-width:80%;padding:8px 13px;border-radius:14px;font-size:.9rem;background:#fff}.msg.me{align-self:flex-end;background:var(--lilac)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.cal div{padding:10px 0;text-align:center;border-radius:10px;background:var(--mist);font-size:.85rem;cursor:pointer;font-weight:600}.cal div.off{background:#fbd9e4;text-decoration:line-through;color:var(--muted)}.cal div.h{background:none;border:0;font-weight:800;cursor:default}
details{border-bottom:1px solid var(--chalk);padding:16px 0}summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:10px}summary::after{content:"+";font-size:1.3rem;line-height:1;color:var(--pink)}details[open] summary::after{content:"\2212"}details p{margin:10px 0 0;color:var(--muted)}
.kpi{display:flex;align-items:flex-end;gap:6px;height:120px}.kpi i{flex:1;background:var(--pink);border-radius:8px 8px 0 0;min-height:6px}
/* ---- layout modelled on the live site ---- */
.circ{width:38px;height:38px;border-radius:50%;background:#e6e6e6;border:0;display:inline-grid;place-items:center;cursor:pointer;color:#000;text-decoration:none;position:relative;font:800 .9rem "Nunito Sans"}
.circ:hover{background:var(--lilac)}.dot{position:absolute;top:-3px;right:-3px;background:var(--pink);color:#fff;border-radius:99px;font-size:.62rem;padding:1px 5px;font-style:normal}
.collage{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,128px);gap:12px}.collage canvas{width:100%;height:100%;object-fit:cover;border-radius:18px;display:block}
.collage .t1{grid-column:1;grid-row:1/3}.collage .t2{grid-column:2;grid-row:1}.collage .t3{grid-column:2;grid-row:2/4}.collage .t4{grid-column:1;grid-row:3}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}@media(max-width:900px){.cats{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.cats{grid-template-columns:1fr}}
.cat{border-radius:22px;padding:20px;min-height:200px;display:flex;flex-direction:column;justify-content:flex-end;position:relative;color:#fff;overflow:hidden;text-decoration:none}
.cat .k{font:800 .68rem "Nunito Sans";letter-spacing:.08em;text-transform:uppercase;opacity:.85}.cat h3{font-size:1.5rem;margin:4px 0}.cat p{margin:0;font-size:.86rem;opacity:.9}
.cat .soon{position:absolute;top:14px;right:14px;background:rgba(255,255,255,.9);color:#000;font:800 .66rem "Nunito Sans";padding:3px 9px;border-radius:99px}
.cat.c1{background:linear-gradient(135deg,#7a1f3d,#d6336c)}.cat.c2{background:linear-gradient(135deg,#222,#666)}.cat.c3{background:var(--lilac);color:#000;cursor:pointer}.cat.c4{background:linear-gradient(135deg,#111,#3a3a3a)}.cat.c5{background:var(--yellow);color:#000}.cat.c6{background:linear-gradient(135deg,#4e080c,#8a1c28)}
.cat.c3 .th{display:flex;gap:6px;margin-bottom:10px}.cat.c3 canvas{width:33%;height:auto;border-radius:10px}
.vlayout{display:grid;grid-template-columns:240px 1fr;gap:28px}@media(max-width:900px){.vlayout{grid-template-columns:1fr}}
.filters .fh{display:flex;justify-content:space-between;margin-bottom:12px}.fg{margin-bottom:18px}.fg>b{display:block;margin-bottom:6px}
.cbx{display:flex;align-items:center;gap:8px;font-weight:500;margin:0 0 6px;font-size:.9rem}.cbx i{margin-left:auto;color:var(--muted);font-style:normal;font-size:.8rem}
.fchips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 16px}.fchip{border:1.5px solid var(--pink);color:var(--pink);border-radius:99px;padding:3px 11px;font-size:.8rem;font-weight:700;cursor:pointer;background:#fff}
.vtop{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.vtop select{width:auto}
.vcard2{background:var(--mist);border-radius:20px;overflow:hidden;display:flex;flex-direction:column}.vph{height:150px;position:relative;display:grid;place-items:center}
.vi{font:600 2.4rem "Bricolage Grotesque",sans-serif;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.35)}.vb{position:absolute;left:10px;top:10px;background:#fff;border-radius:99px;font:800 .68rem "Nunito Sans";padding:3px 10px}
.heart{position:absolute;right:10px;top:10px;width:32px;height:32px;border-radius:50%;border:0;background:#fff;cursor:pointer;color:var(--pink);font-size:1rem}
.vbd{padding:14px;display:flex;flex-direction:column;gap:4px;flex:1}.vft{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:10px;align-items:center}
.auth{display:grid;grid-template-columns:minmax(380px,1fr) 1.1fr;min-height:calc(100vh - 34px)}@media(max-width:900px){.auth{grid-template-columns:1fr}.aside{display:none}}
.aform{padding:28px 44px;display:flex;flex-direction:column;justify-content:space-between;gap:24px;max-width:640px;width:100%;margin:0 auto}.ain{flex:1;padding-top:10px}
.tab{display:block;font:800 .72rem "Nunito Sans";letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-decoration:none;margin-bottom:14px}
.sso{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:14px;border:1.5px solid var(--chalk);border-radius:30px;background:#fff;font:700 .95rem "Nunito Sans";cursor:pointer;margin-bottom:12px}.sso:hover{border-color:#000}
.sso .gi{color:#4285f4;font-weight:800;font-size:1.1rem}.sso .ai{background:#000;color:#fff;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:.7rem}
.or{text-align:center;font:700 .7rem "Nunito Sans";letter-spacing:.1em;color:var(--muted);margin:16px 0}
.aside{position:relative;background:#111;overflow:hidden}.mosaic{position:absolute;inset:-10%;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;opacity:.5;transform:rotate(-5deg)}.mosaic canvas{width:100%;height:100%;object-fit:cover;border-radius:14px}

.trio .card h3{font-size:1.3rem}

.shop{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(260px,1fr);gap:18px;margin-bottom:24px;align-items:start}
.shopimg{position:relative;border-radius:20px;overflow:hidden;background:#ddd}.shopimg canvas{border-radius:0}

.shopside{background:var(--mist);border-radius:20px;padding:20px}
.hotlist{display:flex;flex-direction:column;gap:8px;margin-top:12px}

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hex2rgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return[n>>16&255,n>>8&255,n&255]}
function rgba(h,a){const[r,g,b]=hex2rgb(h);return 'rgba('+r+','+g+','+b+','+a+')'}
function glow(ctx,x,y,r,c,a){ctx.save();ctx.globalCompositeOperation='lighter';const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,rgba(c,a));g.addColorStop(1,rgba(c,0));ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.restore()}

function roundTable(ctx,x,y,s,cloth){
  ctx.fillStyle='rgba(0,0,0,.18)';ctx.beginPath();ctx.ellipse(x,y+s*.16,s*.62,s*.2,0,0,7);ctx.fill();
  for(let i=0;i<8;i++){const a=i/8*Math.PI*2;const cx=x+Math.cos(a)*s*.78,cy=y+Math.sin(a)*s*.27;ctx.fillStyle='#6b5a4a';ctx.beginPath();ctx.ellipse(cx,cy,s*.1,s*.075,0,0,7);ctx.fill()}
  ctx.fillStyle=cloth;ctx.beginPath();ctx.ellipse(x,y,s*.6,s*.2,0,0,7);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.35)';ctx.beginPath();ctx.ellipse(x,y-s*.02,s*.3,s*.08,0,0,7);ctx.fill();
}
function drawVenue(ctx,w,h,type){

    ctx.fillStyle='#8fbf86';ctx.beginPath();ctx.moveTo(0,h*.52);ctx.quadraticCurveTo(w*.25,h*.4,w*.5,h*.5);ctx.quadraticCurveTo(w*.8,h*.6,w,h*.46);ctx.lineTo(w,h*.6);ctx.lineTo(0,h*.6);ctx.fill();
    g=ctx.createLinearGradient(0,h*.55,0,h);g.addColorStop(0,'#7fb069');g.addColorStop(1,'#5f9150');ctx.fillStyle=g;ctx.fillRect(0,h*.55,w,h*.45);
    ctx.fillStyle='#f6f3ec';ctx.beginPath();ctx.moveTo(0,h*.3);ctx.lineTo(w*.5,h*.02);ctx.lineTo(w,h*.3);ctx.lineTo(w,h*.34);ctx.lineTo(0,h*.34);ctx.fill();
    ctx.fillStyle='#e6e0d2';ctx.beginPath();ctx.moveTo(0,h*.34);ctx.lineTo(w*.5,h*.12);ctx.lineTo(w,h*.34);ctx.lineTo(w,h*.37);ctx.lineTo(w*.5,h*.16);ctx.lineTo(0,h*.37);ctx.fill();
    ctx.fillStyle='#d8d0bd';[.08,.5,.92].forEach(p=>ctx.fillRect(w*p-5,h*.3,10,h*.3));
    [[.2,.74],[.5,.82],[.8,.74],[.36,.92],[.66,.92]].forEach(p=>roundTable(ctx,w*p[0],h*p[1],w*.17,'#fbf8f1'));
  } else if(type==='restaurant'){
    g=ctx.createLinearGradient(0,0,0,h*.62);g.addColorStop(0,'#8a6048');g.addColorStop(1,'#6b4a3a');ctx.fillStyle=g;ctx.fillRect(0,0,w,h*.62);
    ctx.fillStyle='#5b3f31';ctx.fillRect(0,0,w,h*.07);
    for(let i=0;i<6;i++){ctx.fillStyle='rgba(0,0,0,.12)';ctx.fillRect(w*(.04+i*.16),h*.14,w*.12,h*.36)}
    for(let i=0;i<4;i++){const x=w*(.15+i*.23);ctx.strokeStyle='#2c2118';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h*.18);ctx.stroke();ctx.fillStyle='#d9b27a';ctx.beginPath();ctx.arc(x,h*.2,w*.025,0,Math.PI,false);ctx.fill();glow(ctx,x,h*.22,w*.05,'#FFD27A',.35)}
    g=ctx.createLinearGradient(0,h*.62,0,h);g.addColorStop(0,'#3b2a20');g.addColorStop(1,'#271b14');ctx.fillStyle=g;ctx.fillRect(0,h*.62,w,h*.38);
    ctx.fillStyle='#a9744f';ctx.fillRect(w*.1,h*.7,w*.8,h*.07);ctx.fillStyle='#8c5d3d';ctx.fillRect(w*.1,h*.77,w*.8,h*.03);
    ctx.fillStyle='#4a3326';[.14,.32,.5,.68,.86].forEach(p=>{ctx.fillRect(w*p-16,h*.8,32,h*.12)});
    ctx.fillStyle='#7a5238';[.14,.32,.5,.68,.86].forEach(p=>ctx.fillRect(w*p-22,h*.62,44,h*.08));
  } else {
    g=ctx.createLinearGradient(0,0,0,h*.58);g.addColorStop(0,'#e9e1d2');g.addColorStop(1,'#d6c9b3');ctx.fillStyle=g;ctx.fillRect(0,0,w,h*.58);
    ctx.fillStyle='#cfc3ae';ctx.fillRect(0,0,w,h*.06);
    for(let i=0;i<4;i++){const x=w*(.09+i*.23),y=h*.14,ww=w*.13,hh=h*.32;ctx.fillStyle='#b9cde0';ctx.beginPath();ctx.moveTo(x,y+hh);ctx.lineTo(x,y+ww*.5);ctx.arc(x+ww/2,y+ww*.5,ww/2,Math.PI,0);ctx.lineTo(x+ww,y+hh);ctx.closePath();ctx.fill();ctx.strokeStyle='#a89a82';ctx.lineWidth=4;ctx.stroke()}
    ctx.fillStyle='#8a6f55';ctx.fillRect(w*.3,h*.5,w*.4,h*.08);ctx.fillStyle='#e8dfcf';ctx.fillRect(w*.33,h*.27,w*.34,h*.23);ctx.strokeStyle='#cfc3ae';ctx.lineWidth=3;ctx.strokeRect(w*.33,h*.27,w*.34,h*.23);
    g=ctx.createLinearGradient(0,h*.58,0,h);g.addColorStop(0,'#b08968');g.addColorStop(1,'#8c6a4c');ctx.fillStyle=g;ctx.fillRect(0,h*.58,w,h*.42);
    ctx.strokeStyle='rgba(0,0,0,.08)';ctx.lineWidth=2;for(let i=1;i<9;i++){ctx.beginPath();ctx.moveTo(w*.5,h*.58);ctx.lineTo(w*(i/9)*1.0,h);ctx.stroke()}
    [[.2,.74],[.5,.8],[.8,.74],[.34,.92],[.66,.92]].forEach(p=>roundTable(ctx,w*p[0],h*p[1],w*.17,'#f3eee3'));
  }
}
function drawCover(ctx,img,w,h){const r=Math.max(w/img.width,h/img.height);const iw=img.width*r,ih=img.height*r;ctx.drawImage(img,(w-iw)/2,(h-ih)/2,iw,ih)}

/* ---- decor primitives ---- */
function garland(ctx,x1,y1,x2,y2,sag,cols,r,R){
  const len=Math.hypot(x2-x1,y2-y1)+sag;const n=Math.max(8,Math.floor(len/(r*1.5)));
  ctx.strokeStyle='rgba(60,40,20,.5)';ctx.lineWidth=1.5;ctx.beginPath();
  for(let i=0;i<=n;i++){const t=i/n;const x=x1+(x2-x1)*t,y=y1+(y2-y1)*t+Math.sin(Math.PI*t)*sag;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke();
  for(let i=0;i<=n;i++){const t=i/n;const x=x1+(x2-x1)*t+(R()-.5)*3,y=y1+(y2-y1)*t+Math.sin(Math.PI*t)*sag+(R()-.5)*4;const rr=r*(.85+R()*.35);
    ctx.fillStyle=cols[i%cols.length];ctx.beginPath();ctx.arc(x,y,rr,0,7);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.28)';ctx.beginPath();ctx.arc(x-rr*.3,y-rr*.3,rr*.35,0,7);ctx.fill()}
}
function strand(ctx,x,y1,y2,cols,r,R){const n=Math.floor((y2-y1)/(r*1.5));for(let i=0;i<=n;i++){const y=y1+i*(y2-y1)/n;ctx.fillStyle=cols[i%cols.length];ctx.beginPath();ctx.arc(x+(R()-.5)*3,y,r*(.85+R()*.3),0,7);ctx.fill()}}
function lights(ctx,x1,y1,x2,y2,sag,n,col,R,gl){
  ctx.strokeStyle='rgba(30,20,10,.55)';ctx.lineWidth=1.2;ctx.beginPath();
  for(let i=0;i<=40;i++){const t=i/40;const x=x1+(x2-x1)*t,y=y1+(y2-y1)*t+Math.sin(Math.PI*t)*sag;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke();
  for(let i=0;i<=n;i++){const t=i/n;const x=x1+(x2-x1)*t,y=y1+(y2-y1)*t+Math.sin(Math.PI*t)*sag;
    ctx.fillStyle='#fff6d6';ctx.beginPath();ctx.arc(x,y+3,2.6,0,7);ctx.fill();glow(ctx,x,y+3,gl,col,.55)}
}
function lantern(ctx,x,top,y,s,col,R){
  ctx.strokeStyle='rgba(60,20,10,.6)';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(x,top);ctx.lineTo(x,y-s*.45);ctx.stroke();
  glow(ctx,x,y,s*1.1,'#FF6A3D',.35);
  const g=ctx.createRadialGradient(x-s*.2,y-s*.2,s*.1,x,y,s*.6);g.addColorStop(0,'#ff6b5a');g.addColorStop(1,col);
  ctx.fillStyle='#E0B04A';ctx.fillRect(x-s*.17,y-s*.5,s*.34,s*.08);
  ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(x,y,s*.5,s*.42,0,0,7);ctx.fill();
  ctx.strokeStyle='rgba(120,10,10,.45)';ctx.lineWidth=1.2;for(let i=-2;i<=2;i++){ctx.beginPath();ctx.ellipse(x,y,s*.5*Math.abs(i)/2.2+.1,s*.42,0,0,7);ctx.stroke()}
  ctx.fillStyle='#E0B04A';ctx.fillRect(x-s*.17,y+s*.4,s*.34,s*.07);
  ctx.strokeStyle='#E0B04A';ctx.lineWidth=1.4;for(let i=-2;i<=2;i++){ctx.beginPath();ctx.moveTo(x+i*s*.05,y+s*.47);ctx.lineTo(x+i*s*.07,y+s*.47+s*.28+R()*4);ctx.stroke()}
}
function fanoos(ctx,x,top,y,s,col,gl,R){
  ctx.strokeStyle='rgba(20,30,25,.6)';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(x,top);ctx.lineTo(x,y-s*.62);ctx.stroke();
  glow(ctx,x,y,s*1.2,'#FFD27A',.38);
  ctx.fillStyle='#D9B35B';ctx.beginPath();ctx.arc(x,y-s*.62,s*.06,0,7);ctx.fill();
  ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(x-s*.34,y-s*.28);ctx.quadraticCurveTo(x,y-s*.95,x+s*.34,y-s*.28);ctx.fill();
  ctx.fillStyle=gl;ctx.beginPath();ctx.moveTo(x-s*.34,y-s*.28);ctx.lineTo(x+s*.34,y-s*.28);ctx.lineTo(x+s*.25,y+s*.38);ctx.lineTo(x-s*.25,y+s*.38);ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(255,230,160,.9)';for(let i=-1;i<=1;i++)for(let j=0;j<2;j++){ctx.beginPath();ctx.arc(x+i*s*.14,y-s*.08+j*s*.28,s*.05,0,7);ctx.fill()}
  ctx.strokeStyle='#8a6a1f';ctx.lineWidth=2;ctx.strokeRect(x-s*.34+2,y-s*.28,s*.68-4,s*.1);
  ctx.fillStyle='#D9B35B';ctx.fillRect(x-s*.28,y+s*.38,s*.56,s*.06);
}
function diya(ctx,x,y,s,R){
  glow(ctx,x,y-s*.4,s*2.1,'#FF9A3D',.5);
  ctx.fillStyle='#B5532A';ctx.beginPath();ctx.ellipse(x,y,s,s*.45,0,0,Math.PI);ctx.fill();
  ctx.fillStyle='#8f3d1d';ctx.beginPath();ctx.ellipse(x,y,s,s*.2,0,0,7);ctx.fill();
  ctx.fillStyle='#FFD27A';ctx.beginPath();ctx.moveTo(x,y-s*1.1);ctx.quadraticCurveTo(x+s*.4,y-s*.4,x,y-s*.1);ctx.quadraticCurveTo(x-s*.4,y-s*.4,x,y-s*1.1);ctx.fill();
}
function rangoli(ctx,cx,cy,r,P,R){
  ctx.save();ctx.translate(cx,cy);ctx.scale(1,.34);
  ctx.fillStyle='rgba(255,255,255,.14)';ctx.beginPath();ctx.arc(0,0,r*1.08,0,7);ctx.fill();
  const rings=[[1,16,.11],[.78,14,.1],[.56,12,.09],[.36,10,.08]];
  rings.forEach((rg,k)=>{const n=rg[1];for(let i=0;i<n;i++){const a=i/n*Math.PI*2;ctx.fillStyle=[P[0],P[1],P[2],'#fff'][(i+k)%4];ctx.beginPath();ctx.arc(Math.cos(a)*r*rg[0],Math.sin(a)*r*rg[0],r*rg[2],0,7);ctx.fill()}});
  ctx.fillStyle=P[0];ctx.beginPath();for(let i=0;i<16;i++){const a=i/16*Math.PI*2,rr=i%2?r*.12:r*.24;ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}ctx.fill();
  ctx.restore();
}
function crescentStar(ctx,x,y,r,col){
  glow(ctx,x,y,r*1.8,col,.35);ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.arc(x+r*.38,y,r*.82,0,Math.PI*2,true);ctx.fill('evenodd');
  const sx=x+r*.62,sy=y-r*.05,sr=r*.3;ctx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?sr*.45:sr;ctx.lineTo(sx+Math.cos(a)*rr,sy+Math.sin(a)*rr)}ctx.closePath();ctx.fill();
}
function geoStar(ctx,x,y,r,col,n){
  ctx.save();ctx.strokeStyle=col;ctx.lineWidth=2;ctx.beginPath();for(let i=0;i<n*2;i++){const a=i/(n*2)*Math.PI*2,rr=i%2?r*.58:r;ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}ctx.closePath();ctx.stroke();
  ctx.beginPath();ctx.arc(x,y,r*.38,0,7);ctx.stroke();ctx.beginPath();ctx.arc(x,y,r*1.08,0,7);ctx.stroke();ctx.restore();
}
function blossom(ctx,x1,y1,x2,y2,R){
  ctx.strokeStyle='#4a2c20';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x1,y1);ctx.quadraticCurveTo((x1+x2)/2,y1-30,x2,y2);ctx.stroke();
  for(let i=0;i<46;i++){const t=R();const x=x1+(x2-x1)*t+(R()-.5)*70,y=y1+(y2-y1)*t-Math.sin(Math.PI*t)*22+(R()-.5)*60;ctx.fillStyle=R()>.4?'#F6B6C8':'#fbd6e0';ctx.beginPath();ctx.arc(x,y,4+R()*4,0,7);ctx.fill();ctx.fillStyle='#E8A33D';ctx.beginPath();ctx.arc(x,y,1.5,0,7);ctx.fill()}
}
function couplet(ctx,x,y,w,h,ch){
  ctx.fillStyle='#C8102E';ctx.fillRect(x,y,w,h);ctx.strokeStyle='#F2C14E';ctx.lineWidth=3;ctx.strokeRect(x+5,y+5,w-10,h-10);
  ctx.fillStyle='#F2C14E';ctx.font='700 '+(w*.5)+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';
  for(let i=0;i<ch.length;i++)ctx.fillText(ch[i],x+w/2,y+h*(.2+i*.3));
}
function ingot(ctx,x,y,s){
  glow(ctx,x,y,s*1.6,'#F2C14E',.3);ctx.fillStyle='#E0A82A';ctx.beginPath();ctx.moveTo(x-s,y-s*.2);ctx.quadraticCurveTo(x-s*.6,y+s*.55,x,y+s*.45);ctx.quadraticCurveTo(x+s*.6,y+s*.55,x+s,y-s*.2);ctx.quadraticCurveTo(x+s*.5,y-s*.45,x,y-s*.35);ctx.quadraticCurveTo(x-s*.5,y-s*.45,x-s,y-s*.2);ctx.fill();
  ctx.fillStyle='#F7D56E';ctx.beginPath();ctx.ellipse(x,y-s*.15,s*.55,s*.2,0,0,7);ctx.fill();
}
function knot(ctx,x,y,s){ctx.strokeStyle='#E0B04A';ctx.lineWidth=3;ctx.fillStyle='#C8102E';ctx.beginPath();ctx.arc(x,y,s*.26,0,7);ctx.fill();ctx.stroke();ctx.beginPath();ctx.moveTo(x,y+s*.26);for(let i=-1;i<=1;i++){ctx.moveTo(x+i*s*.1,y+s*.26);ctx.lineTo(x+i*s*.12,y+s*.7)}ctx.stroke()}
function drape(ctx,x,w,h,col,R){for(let i=0;i<8;i++){const g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,rgba(col,.5));g.addColorStop(1,rgba(col,.12));ctx.fillStyle=g;ctx.fillRect(x+i*w/8,0,w/8+1,h*(.85+R()*.1))}}

/* ---- decorate: apply a culture and a variant over a base image ---- */
function decorate(ctx,w,h,cid,variant,seed){
  const R=mulberry(seed),C=CULTURES[cid],P=C.palette,V=VARIANTS.find(v=>v.key===variant)||VARIANTS[0],d=V.d,ev=V.key==='evening';
  // colour grade
  ctx.save();ctx.globalCompositeOperation=ev?'multiply':'soft-light';ctx.fillStyle=rgba(ev?'#3a2550':P[0],ev?.55:.38);ctx.fillRect(0,0,w,h);ctx.restore();
  if(V.key==='lavish'){const g=ctx.createRadialGradient(w/2,h/2,h*.3,w/2,h/2,h*.95);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.28)');ctx.fillStyle=g;ctx.fillRect(0,0,w,h)}
  const top=0;
  if(cid==='diwali'){
    const cols=['#F2A71B','#E4572E','#F7C948','#E8851C'];
    const sw=[[.01,.34],[.34,.67],[.67,.99]];
    sw.forEach((s,i)=>garland(ctx,w*s[0],h*.1,w*s[1],h*.1,h*(.07+(i===1?.02:0)),cols,w*.011,R));
    if(d>1.2){sw.forEach(s=>garland(ctx,w*s[0],h*.17,w*s[1],h*.17,h*.06,cols,w*.009,R))}
    const nStr=Math.round(5*d);for(let i=0;i<nStr;i++){const x=w*(.04+i*(.92/Math.max(1,nStr-1)));strand(ctx,x,h*.1,h*(.28+R()*.22),cols,w*.008,R)}
    lights(ctx,w*.02,h*.21,w*.98,h*.21,h*.05,Math.round(34*d),'#FFC76B',R,w*.02);
    const nd=Math.round(12*d);for(let i=0;i<nd;i++){const t=i/(nd-1);diya(ctx,w*(.12+t*.76),h*(.9+Math.sin(t*Math.PI)*.04),w*.011,R)}
    if(d>.8){const n2=Math.round(7*d);for(let i=0;i<n2;i++){const t=i/(n2-1);diya(ctx,w*(.2+t*.6),h*.68,w*.008,R)}}
    rangoli(ctx,w*.5,h*(d>1?.83:.85),w*(d>1?.13:.1),P,R);
  } else if(cid==='eid'){
    const dr=d>1?.2:.14;drape(ctx,0,w*dr,h*.6,'#F4EFD8',R);drape(ctx,w*(1-dr),w*dr,h*.6,'#F4EFD8',R);
    crescentStar(ctx,w*.5,h*.2,h*(d>1?.1:.085),'#E8C468');
    ctx.save();ctx.globalAlpha=.7;geoStar(ctx,w*.5,h*.38,h*.1,'#E8C468',8);geoStar(ctx,w*.12,h*.3,h*.05,'#E8C468',8);geoStar(ctx,w*.88,h*.3,h*.05,'#E8C468',8);ctx.restore();
    const nl=Math.round(7*d);for(let i=0;i<nl;i++){const t=i/(nl-1);const x=w*(.08+t*.84);if(Math.abs(x-w*.5)<w*.07)continue;fanoos(ctx,x,0,h*(.18+R()*.2),h*(.1+R()*.03),P[0],'#F7D58A',R)}
    garland(ctx,w*.02,h*.07,w*.98,h*.07,h*.05,['#1F6F5C','#2F8F73','#D9B35B'],w*.008,R);
    lights(ctx,w*.0,h*.12,w*1,h*.12,h*.06,Math.round(36*d),'#FFE29A',R,w*.018);
    ctx.fillStyle=rgba(P[1],.6);ctx.fillRect(w*.3,h*.575,w*.4,h*.012);
    const nd=Math.round(6*d);for(let i=0;i<nd;i++){const t=i/(nd-1);fanoos(ctx,w*(.18+t*.64),h*.62,h*.9,h*.05,P[0],'#F7D58A',R)}
  } else {
    const nl=Math.round(9*d);for(let i=0;i<nl;i++){const t=i/(nl-1);lantern(ctx,w*(.05+t*.9),0,h*(.12+R()*.2),h*(.075+R()*.03),'#C8102E',R)}
    if(d>1.2){for(let i=0;i<5;i++)lantern(ctx,w*(.12+i*.19),0,h*(.34+R()*.1),h*.06,'#E0201C',R)}
    garland(ctx,w*.0,h*.05,w*1,h*.05,h*.035,['#F2C14E','#C8102E'],w*.007,R);
    couplet(ctx,w*.02,h*.2,w*.06,h*.42,'福春');couplet(ctx,w*.92,h*.2,w*.06,h*.42,'喜年');
    blossom(ctx,w*.0,h*.62,w*.26,h*.74,R);blossom(ctx,w*1,h*.62,w*.74,h*.74,R);
    const nk=Math.round(4*d);for(let i=0;i<nk;i++)knot(ctx,w*(.2+i*(.6/Math.max(1,nk-1))),h*.28,h*.09);
    const ni=Math.round(5*d);for(let i=0;i<ni;i++)ingot(ctx,w*(.3+i*(.4/Math.max(1,ni-1))),h*(.9+(i%2)*.03),h*.03);
    lights(ctx,w*.0,h*.15,w*1,h*.15,h*.05,Math.round(30*d),'#FFB36B',R,w*.018);
  }
  if(ev){ctx.save();ctx.globalCompositeOperation='lighter';for(let i=0;i<14;i++)glow(ctx,w*R(),h*(.1+R()*.3),w*.09,P[0],.18);ctx.restore()}
}

/* ----- canvas painting ----- */
function srcOf(ref){
  if(!ref)return{kind:'sample',id:'hall'};
  if(ref.kind==='sample')return ref;
  const img=MEM.imgs[ref.key];return img?{kind:'img',img}:{kind:'sample',id:'hall'};

function paintAll(root){
  $$('canvas[data-paint]',root).forEach(cv=>{
    const a=cv.dataset.paint.split(':');
    try{
      if(a[0]==='sample')paintBase(cv,{kind:'sample',id:a[1]});
      else if(a[0]==='gal')paintDesign(cv,{kind:'sample',id:a[2]},a[1],a[3],+a[4]||7);
      else if(a[0]==='design'){const d=S.designs.find(x=>x.id===a[1]);if(d)paintDesign(cv,srcOf(d.src),d.culture,d.variant,d.seed)}
      else if(a[0]==='orig'){const d=S.designs.find(x=>x.id===a[1]);if(d)paintBase(cv,srcOf(d.src))}
      else if(a[0]==='photo'){const p=S.draft.photos[+a[1]];paintBase(cv,srcOf(p))}
    }catch(e){console.error(e)}
  });
}

  openModal('<div class="mono">Booking</div><h3>Book '+esc(v.name)+'</h3><table class="t" style="margin:10px 0"><tbody><tr><td>Service</td><td>'+esc(q.service)+'</td></tr><tr><td>Event</td><td>'+esc(ev.name)+', '+niceDate(ev.date)+'</td></tr><tr><td>Agreed price</td><td><b>'+money(q.price)+'</b></td></tr></tbody></table><div class="fld"><label>Payment arrangement (to be confirmed with the client)</label><select id="payopt"><option value="full">Pay in full now</option><option value="dep">Pay a 30% deposit now, the rest later</option></select></div><div class="card flat" style="background:var(--mist)"><b>Your money is held safely.</b><div class="small muted">Payment is held by the platform until the service is complete. Then the vendor requests a payout. Test mode: no real payment.</div></div><div style="display:flex;justify-content:flex-end;margin-top:14px"><button class="btn p" data-act="payBooking" data-id="'+id+'">Pay and confirm booking (test)</button></div>');

function payBooking(id){
  const q=S.quotes.find(x=>x.id===id),opt=$('#payopt').value,ev=S.events.find(e=>e.id===q.eventId);
  const paid=opt==='dep'?Math.round(q.price*.3):q.price;
  S.bookings.unshift({id:'b'+(++S.ids.b),quoteId:id,vendorId:q.vendorId,eventId:ev.id,service:q.service,amount:q.price,paid:paid,date:ev.date||inDays(14),status:'Confirmed',rs:0});
  q.status='Booked';ev.status='Booked';flag('book');notify('Booking confirmed with '+vend(q.vendorId).name+'. '+money(paid)+' is held.');save();closeModal();go('/bookings');toast('Booking confirmed. Funds are held until the job is done.');
}

function vFiltered(){

  cat('c1','Category 1','Weddings','Ceremonies, receptions, welcome dinners, brunches.',1)+cat('c2','Category 2','Milestone Birthdays','Landmark birthdays at home or in a venue.',1)+
  '<a class="cat c3" href="#/explore"><div class="th"><canvas data-paint="gal:diwali:hall:classic:11"></canvas><canvas data-paint="gal:eid:garden:classic:21"></canvas><canvas data-paint="gal:lny:restaurant:classic:31"></canvas></div><span class="k">Category 3 &middot; Available now</span><h3>Cultural Celebrations</h3><p>Diwali, Eid and Lunar New Year, with culture cards and expert sign-off.</p></a>'+
  cat('c4','Category 4','Corporate and Brand Events','Launches, galas and team celebrations.',1)+cat('c5','Category 5','At-home Gatherings','Dinner parties, anniversaries, baby welcomes.',1)+cat('c6','Category 6','Anniversaries and Reunions','Family and friends, together again.',1)+'</div></div></section>'+
  '<section class="sec"><div class="wrap"><div style="display:flex;justify-content:space-between;align-items:end;gap:10px;flex-wrap:wrap;margin-bottom:20px"><div><div class="mono">Marketplace</div><h2 style="margin:0">Top event vendors near you</h2></div><a class="btn" href="#/vendors">See all</a></div><div class="grid g4">'+VENDORS.filter(v=>v.rating>=4.8).slice(0,4).map(v=>vcard(v)).join('')+'</div></div></section>'+
  '<section class="sec dark"><div class="wrap grid g2" style="gap:40px;align-items:center"><div><div class="mono" style="color:var(--lilac)">Vendor booking</div><h2>Quote, negotiate, book, pay.</h2><p style="opacity:.8">Send your chosen design to several vendors. Compare quotes, negotiate for up to three rounds, and pay through the platform. Your money is held until the job is done.</p><a class="btn b" href="#/how">See the booking process</a></div><div class="grid g2">'+[['Vendor categories','Decorators, florists, lighting, catering, DJs, photography'],['Verified vendors','Every vendor is approved by our team before going live'],['Multiple vendors','Book different services for the same event'],['Held payments','Released to the vendor when the service is complete']].map(x=>'<div style="border:1px solid rgba(255,255,255,.25);border-radius:16px;padding:16px"><b>'+x[0]+'</b><div class="small" style="opacity:.75;margin-top:4px">'+x[1]+'</div></div>').join('')+'</div></div></section>'+
  '<section class="sec"><div class="wrap"><div class="center"><div class="mono">Plans</div><h2>Start free. Upgrade if you need more.</h2><p class="muted">Your first set of four designs is free. Bookings cost only what vendors quote.</p></div><div style="margin-top:26px">'+pricingBlock()+'</div></div></section>'+
  '<section class="sec alt"><div class="wrap center"><h2>Join hosts planning with EventCulture.</h2><div class="grid g3 trio" style="margin-top:22px;text-align:left">'+[['It\'s instant','Upload a photo, describe the feeling. Four concepts in about 90 seconds, no planner required.'],['It\'s worth it','Free to try. You pay a vendor\'s quote through the platform, and it is held until the job is done.'],['You\'re protected','Every vendor is verified by our team. Payments are held until the service is complete. Your photos stay yours.']].map(x=>'<div class="card" style="background:#fff"><h3>'+x[0]+'</h3><p class="muted small" style="margin:0">'+x[1]+'</p></div>').join('')+'</div></div></section>'+
  '<section class="sec"><div class="wrap" style="max-width:780px"><div class="center"><h2>Questions</h2></div>'+faqList(5)+'<div class="center" style="margin-top:20px"><a class="btn" href="#/faq">All FAQs</a></div></div></section>'+
  '<section class="sec center" style="background:var(--lilac)"><div class="wrap"><h2>Now let\'s see your celebration.</h2><p>Take one photo of the space. Tell us how you want it to feel. Four visions in about 90 seconds, then a calm next step.</p>'+startCta('Start with your space')+'<p class="small" style="margin-top:12px">Free to try &middot; No card required &middot; 90-second visualisation</p></div></section>'+footer();
};

/* ===== Shop the look: blinking hotspots on a design, linked to vendor categories ===== */
const HOTS={
  diwali:[
    {x:.50,y:.10,item:'Marigold garlands',cat:'Florists',note:'Fresh or artificial marigold garlands and strands.'},
    {x:.74,y:.21,item:'String lights',cat:'Lighting',note:'Warm fairy lights and canopy lighting.'},
    {x:.50,y:.84,item:'Rangoli at the entrance',cat:'Decorators',note:'Hand-made or powder rangoli designs.'},
    {x:.22,y:.91,item:'Diyas (oil lamps)',cat:'Lighting',note:'Diya displays and lamp arrangements.'},
    {x:.20,y:.36,item:'Hanging strands',cat:'Decorators',note:'Floral and bead strands that hang from the ceiling.'}
  ],
  eid:[
    {x:.50,y:.20,item:'Crescent and star centrepiece',cat:'Decorators',note:'Backdrops and arches with crescent and star motifs.'},
    {x:.08,y:.30,item:'Draped curtains',cat:'Draping and stages',note:'Ceiling drapes, curtains and stage backdrops.'},
    {x:.30,y:.22,item:'Lanterns (fanoos)',cat:'Lighting',note:'Fanoos lanterns and warm lighting.'},
    {x:.72,y:.08,item:'Greenery garland',cat:'Decorators',note:'Green and gold garlands along the top.'},
    {x:.68,y:.64,item:'Table lanterns',cat:'Decorators',note:'Lanterns and centrepieces for the tables.'}
  ],
  lny:[
    {x:.30,y:.18,item:'Red lanterns',cat:'Lighting',note:'Hanging lantern ceilings and lighting.'},
    {x:.06,y:.40,item:'Couplet banners',cat:'Decorators',note:'Red and gold banners with calligraphy.'},
    {x:.13,y:.70,item:'Plum blossom',cat:'Florists',note:'Blossom branches and red-and-gold flowers.'},
    {x:.50,y:.29,item:'Gold knots',cat:'Decorators',note:'Chinese knots and gold accents.'},
    {x:.50,y:.91,item:'Gold ingots',cat:'Decorators',note:'Gold ingot table and floor decor.'}
  ]
};
let HOT=-1;
function hotDesign(){
  const ev=S.events.find(e=>e.id===S.cur);if(!ev)return null;
  const ds=S.designs.filter(d=>d.eventId===ev.id);return ds.find(d=>d.id===S.viewD)||ds[0]||null;
}
function hotVendors(h,cid){
  const inCat=VENDORS.filter(v=>v.cat===h.cat);
  const match=inCat.filter(v=>v.cultures.includes(cid));
  return {all:inCat,match:match.length?match:inCat,exact:match.length>0};
}
function hotSide(){
  const d=hotDesign();if(!d)return '';
  const hs=HOTS[d.culture]||[];
  if(HOT<0||!hs[HOT]){
    return '<div class="mono">Shop the look</div><h3 style="margin:.2em 0 .4em">Explore vendors for each item</h3><p class="muted small">Click a blinking circle on the image to see the vendors who can supply that item.</p><div class="hotlist">'+hs.map((h,i)=>'<button class="hotitem" data-act="hot" data-i="'+i+'"><span class="hn">'+(i+1)+'</span><span><b>'+esc(h.item)+'</b><small>'+esc(h.cat)+' &middot; '+(n=>n+' vendor'+(n>1?'s':''))(hotVendors(h,d.culture).match.length)+'</small></span></button>').join('')+'</div>';
  }
  const h=hs[HOT],v=hotVendors(h,d.culture),nm=cult(d.culture).name;
  return '<button class="link small" data-act="hotback">&larr; All items</button><div class="mono" style="margin-top:8px">Selected item</div><h3 style="margin:.2em 0 .3em">'+esc(h.item)+'</h3><p class="muted small">'+esc(h.note)+'</p>'+
  '<div class="small" style="margin:6px 0 10px"><b>'+v.match.length+' vendor'+(v.match.length>1?'s':'')+'</b> in '+esc(h.cat.toLowerCase())+(v.exact?', listed for '+esc(nm)+' events':' (none list '+esc(nm)+' yet)')+'</div>'+
  '<div class="hotv">'+v.match.slice(0,3).map(x=>'<button class="hv" data-act="vprofile" data-id="'+x.id+'"><span class="sw" style="background:linear-gradient(135deg,'+x.c[0]+','+x.c[1]+')"></span><span><b>'+esc(x.name)+'</b><small>'+esc(x.city)+' &middot; &#9733; '+x.rating+' &middot; '+x.price+'</small></span></button>').join('')+'</div>'+
  '<button class="btn p" style="width:100%;margin-top:12px" data-act="hotgo">See all '+esc(h.cat.toLowerCase())+' &rarr;</button>';
}
function hotViewer(){
  const d=hotDesign();if(!d)return '';
  const hs=HOTS[d.culture]||[];
  return '<div class="shop"><div class="shopimg"><canvas class="art" data-paint="design:'+d.id+'" style="border-radius:0"></canvas>'+
  hs.map((h,i)=>'<button class="hspot'+(i===HOT?' on':'')+'" style="left:'+(h.x*100)+'%;top:'+(h.y*100)+'%" data-act="hot" data-i="'+i+'" aria-label="Explore vendors for '+esc(h.item)+'"></button>').join('')+
  '<span class="shoptag">'+esc(d.vname)+'</span></div><aside class="shopside" id="shopside">'+hotSide()+'</aside></div>';
}
function hotRefresh(){
  const s=$('#shopside');if(s)s.innerHTML=hotSide();
  $$('.shopimg .hspot').forEach((b,i)=>b.classList.toggle('on',i===HOT));
}
ACT.hot=el=>{HOT=+el.dataset.i;hotRefresh()};
ACT.hotback=()=>{HOT=-1;hotRefresh()};
ACT.dview=el=>{S.viewD=el.dataset.id;HOT=-1;save();render();window.scrollTo({top:0,behavior:'smooth'})};
ACT.hotgo=()=>{
  const d=hotDesign();if(!d||HOT<0)return;const h=HOTS[d.culture][HOT],v=hotVendors(h,d.culture);
  S.vf=dvf();S.vf.cat=[h.cat];if(v.exact)S.vf.ev=[d.culture];
  S.vfFrom={item:h.item,cat:h.cat,culture:d.culture};save();go('/vendors');
};
const _results=VIEWS['/results'];
VIEWS['/results']=function(){
  HOT=-1;S.vfFrom=null;
  let html=_results();
  if(S.role!=='customer'||html.indexOf('<div class="grid g2"><div class="dc">')<0)return html;
  html=html.replace('<div class="grid g2"><div class="dc">',hotViewer()+'<div class="grid g2"><div class="dc">');
  html=html.replace(/<canvas class="art" data-paint="design:([^"]+)" style="border-radius:0"><\/canvas><div class="bd">/g,'<canvas class="art" data-act="dview" data-id="$1" data-paint="design:$1" style="border-radius:0;cursor:pointer" title="Click to open this design above"></canvas><div class="bd">');
  return html;
};
const _vendors=VIEWS['/vendors'];
VIEWS['/vendors']=function(){
  let html=_vendors();const f=S.vfFrom;
  if(f)html=html.replace('<div class="vlayout">','<div class="banner" style="background:#fdeaf3"><div class="grow"><b>Showing '+esc(f.cat.toLowerCase())+' for &ldquo;'+esc(f.item)+'&rdquo;</b><div class="small">Filtered from your '+esc(cult(f.culture).name)+' design. Change the filters on the left to widen it.</div></div><a class="btn sm" href="#/results" data-act="hotclear">Back to my design</a></div><div class="vlayout">');
  return html;
};
ACT.hotclear=()=>{S.vfFrom=null};
const _vclear=ACT.vclear;ACT.vclear=()=>{S.vfFrom=null;_vclear()};

/* ===== START ===== */
render();

</script>
</body></html>
